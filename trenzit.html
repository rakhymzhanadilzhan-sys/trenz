<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 260px;
        }
        #display {
            width: 100%;
            height: 60px;
            background: #333;
            color: #fff;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            transition: background 0.2s;
        }
        button:hover {
            background: #555;
        }
        button.operator {
            background: #ff9500;
        }
        button.operator:hover {
            background: #e08500;
        }
        button.clear {
            background: #d9534f;
        }
        button.clear:hover {
            background: #c9302c;
        }
        button.equal {
            background: #5cb85c;
            grid-column: span 2;
        }
        button.equal:hover {
            background: #4cae4c;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="deleteChar()">←</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="button onclick">3</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        if (display.value === '0' || display.value === 'Ошибка') {
            display.value = val;
        } else {
            display.value += val;
        }
    }

    function clearDisplay() {
        display.value = '0';
    }

    function deleteChar() {
        if (display.value.length > 1 && display.value !== 'Ошибка') {
            display.value = display.value.slice(0, -1);
        } else {
            display.value = '0';
        }
    }

    function calculate() {
        try {
            // Используем eval для простого вычисления математической строки
            display.value = eval(display.value.replace(/×/g, '*').replace(/÷/g, '/'));
        } catch (error) {
            display.value = 'Ошибка';
        }
    }
</script>

</body>
</html>
